<div class="row">
  <div class="dropdown">
    <div class="dropdown-label-content-no-value" *ngIf="!value">{{ label }} <mat-icon>expand_more</mat-icon></div>
    <div class="dropdown-label-content" *ngIf="value">{{ label }} <mat-icon (click)="onCloseEvent()" class="mat-icon-close">close</mat-icon></div>
    <div class="dropdown-content">
      <div *ngFor="let opt of options" class="dropdown-option" (click)="onSelectValue(opt)">
        {{ opt }}
      </div>
    </div>
  </div>
</div>
