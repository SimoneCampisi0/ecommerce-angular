<div class="pagination" *ngIf="totalPages > 1">
  <div class="pagination-box">
    <a (click)="changePage(1)" class="pagination-element-arrow"> < </a>
    <div *ngFor="let page of visiblePages" class="pagination-element">
      <a (click)="changePage(page)"
         [ngClass]="{'active-page': page === (currentPage+1)}">
        {{ page }}
      </a>
    </div>
    <a (click)="changePage(this.totalPages)" class="pagination-element-arrow"> > </a>
  </div>
</div>
